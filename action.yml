name: "gh-deploy-sheet-updater"
description: "Github Action 배포시트 업데이트"
author: "deali-web"

inputs:
  project:
    description: "프로젝트명"
    required: true
  environment:
    description: "실행환경"
    required: true
  message:
    description: "배포 용도"
    required: false
  end_date:
    description: "사용기간"
    required: false
  github_ref_name:
    description: "Github Ref Name"
    required: false
  github_actor:
    description: "Github Actor"
    required: false
  github_token:
    description: "GitHub Token (커밋 메시지, PR 정보 자동 조회에 사용)"
    required: false
    default: ${{ github.token }}
  commit_message:
    description: "커밋 메시지 (미입력 시 GitHub API로 자동 조회)"
    required: false
  pr_number:
    description: "PR 번호 (미입력 시 GitHub API로 자동 조회)"
    required: false
  pr_title:
    description: "PR 제목 (미입력 시 GitHub API로 자동 조회)"
    required: false
  google_sheets_credentials:
    description: "Google Sheets Credentials"
    required: true
  spreadsheet_id:
    description: "Google Sheets Spreadsheet ID"
    required: true

runs:
  using: "node20"
  main: "dist/index.js"
